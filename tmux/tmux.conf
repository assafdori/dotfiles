#--------------------------------------------------------------------------
# Source any "reset" or fallback config first
#--------------------------------------------------------------------------
source-file ~/.config/tmux/tmux.reset.conf

#--------------------------------------------------------------------------
# Basic Settings
#--------------------------------------------------------------------------
# Use a large scrollback buffer
set -g history-limit 1000000

# Use Vi mode in copy/selection
setw -g mode-keys vi

# Address Vim mode switching delay
set -s escape-time 0

# Use a blinking-bar cursor style (where supported)
set -g @cursor_style bar

# Proper terminal usage and color improvements
set -g default-terminal "$TERM"
set -as terminal-features ",*:RGB"
set -ag terminal-overrides ",xterm-256color:RGB"

# Enable undercurl and undercurl colors (where supported)
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'

# Enable cursor shape and blinking support
set -ga terminal-overrides '*:Ss=\E[%p1%d q:Se=\E[ q'

# Enable setting the system clipboard
set-option -g set-clipboard on

# Start window/pane numbering at 1
set -g base-index 1
setw -g pane-base-index 1

# Allow tmux to rename windows automatically
set -g allow-rename on
setw -g automatic-rename on

# Renumber windows when one is removed
set -g renumber-windows on

# Allow the mouse to resize panes and select windows
set -g mouse on

# Set tmux titles
set -g set-titles on

# Monitor window activity
setw -g monitor-activity on
set -g bell-action any

# Disable visual notifications
set -g visual-bell off
set -g visual-activity off

# Enable focus events (for terminals that support them)
set -g focus-events on

# Resize panes more aggressively for different terminal sizes
setw -g aggressive-resize on

# Don't detach tmux session when it’s killed
set -g detach-on-destroy off

# Update environment for FZF options if desired
set -ga update-environment FZF_DEFAULT_OPTS

#--------------------------------------------------------------------------
# Status Line and Theming
#--------------------------------------------------------------------------
# Use terminal palette colors so tmux follows the active Ghostty theme.
# Keep background at "default" for transparent statusline behavior.
thm_bg="default"
thm_fg="default"
thm_muted="colour8"
thm_accent="colour14"
thm_warn="colour11"
thm_surface="colour0"
thm_active_bg="colour8"
thm_active_fg="colour15"

# Enable status line and position it
set -g status "on"
set -g status-position bottom
set -g status-justify left
set -g status-style "fg=${thm_fg},bg=${thm_bg}"

# Window/pane border styles
set -g pane-active-border-style "fg=default"
set -g pane-border-style "default"
set -g pane-border-lines "single"
set -gw pane-border-indicators 'colour'
set -g window-status-activity-style "none"

# Status left: session name with color-change indicator on prefix
set -g status-left "#[fg=#{?client_prefix,${thm_surface},${thm_fg}},bg=#{?client_prefix,${thm_warn},default},bold] #S #[default]"

# Status left length
set -g status-left-length 50

# Status right: git status and padding
set -g status-right "#{?#{==:#{pane_current_command},nvim},#[fg=${thm_fg}] #($HOME/.config/tmux/scripts/git-status.sh #{pane_current_path}),}#[default] "

# Update status interval
set -g status-interval 1

# Window status formats
setw -g window-status-format "#[fg=${thm_muted},bg=default] #I #[fg=${thm_fg},bg=default]#{?#{e|>:#{window_panes},1}, #{pane_current_command},#W}#{?window_zoomed_flag, ,} "
setw -g window-status-current-format "#[fg=${thm_fg},bg=default]#[fg=${thm_active_fg},bg=${thm_active_bg},bold] #I #{?#{e|>:#{window_panes},1}, #{pane_current_command},#W}#{?window_zoomed_flag, ,} #[fg=${thm_active_bg},bg=default]"

# Window separator
setw -g window-status-separator ""

# Pane style when active/inactive
# Intentionally not setting fg/bg here — let the terminal theme (Ghostty) control pane colors
set-window-option -g window-active-style "default"
set-window-option -g window-style "default"

# Message area styles
set -g message-style "fg=${thm_warn},bg=default,align=centre"
set -g message-command-style "fg=${thm_accent},bg=default,align=centre"

# Optional: Set session/window titles in terminal
set-option -g set-titles-string "#S / #W"

set -g update-environment "DISPLAY SSH_ASKPASS SSH_AGENT_PID SSH_CONNECTION WINDOWID XAUTHORITY"
setenv -g SSH_AUTH_SOCK $HOME/.ssh/ssh_auth_sock
setenv -g GNUPGHOME $HOME/.gnupg


#--------------------------------------------------------------------------
# Key Bindings
#--------------------------------------------------------------------------
# Set prefix to Ctrl-A
set -g prefix C-a

# Enable extended keys for better key binding support (added to support pi-coding-agent-cli)
set -g extended-keys on
set -g extended-keys-format csi-u

# Send prefix to nested sessions by pressing Ctrl-A twice
bind C-a send-prefix

# Reload config
unbind r
bind r source-file ~/.config/tmux/tmux.conf\; display-message 'tmux config reloaded!'

# Navigate windows with Ctrl + p/n
bind C-p previous-window
bind C-n next-window

# Vim-like pane navigation (with prefix key)
bind -r h select-pane -L
bind -r j select-pane -D
bind -r k select-pane -U
bind -r l select-pane -R
bind -r C-h select-window -t :-
bind -r C-l select-window -t :+

# Note: Ctrl+hjkl navigation is handled by vim-tmux-navigator plugin (see Plugins section)

# Switch most recently used windows
bind Space last-window

# Switch between two most recently used sessions
bind b switch-client -l

# Move current window up/down in the window list
bind -r N run-shell "tmux swap-window -t $(expr $(tmux list-windows | grep \"(active)\" | cut -d \":\" -f 1) + 1)"
bind -r P run-shell "tmux swap-window -t $(expr $(tmux list-windows | grep \"(active)\" | cut -d \":\" -f 1) - 1)"

# Split panes
bind v split-window -h -c "#{pane_current_path}"
bind s split-window -v -c "#{pane_current_path}"

# Create new window in same path
bind C new-window -c "#{pane_current_path}"

# Resize panes with SHIFT or CTRL
bind -r H resize-pane -L 5
bind -r L resize-pane -R 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r C-H resize-pane -L 5
bind -r C-L resize-pane -R 5
bind -r C-J resize-pane -D 5
bind -r C-K resize-pane -U 5

# Kill pane quickly
bind c kill-pane

# Open lazygit in new window
bind g new-window -n ' lazygit' -c "#{pane_current_path}" "lazygit"

# Open GitHub Dashboard in new (or existing) session
bind G run-shell "tmux switch-client -t gh-dash || tmux new-session -d -s gh-dash -c '$HOME' gh dash && tmux switch-client -t gh-dash"

# Open k9s in new window with prefix + ctrl-k
bind C-k new-window -c "#{pane_current_path}" "k9s"

# Open btop in new window with prefix + ctrl-t
bind t new-window -c "#{pane_current_path}" "btop"

# Open Amazon Q CLI in new window
bind Q new-window -c "#{pane_current_path}" "kiro-cli"

# Copy tmux buffer to system clipboard
#bind-key -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"
# bind y run -b "tmux show-buffer | xclip -selection clipboard"
bind y run -b "tmux show-buffer | pbcopy" \; display-message "copied tmux buffer to system clipboard"

# Break and rejoin panes
bind-key B break-pane -d
bind-key E command-prompt -p "join pane from: " "join-pane -h -s '%%'"

# AI integrations
bind o new-window -n " opencode" -c "#{pane_current_path}" "opencode"
bind O new-window -n "󰖟 opencode" -c "#{pane_current_path}" "opencode web"
bind C-a new-window -n " codex" -c "#{pane_current_path}" "codex"
bind C-p new-window -n "󰏿 pi" -c "#{pane_current_path}" "pi"
bind C-c new-window -n " claude" -c "#{pane_current_path}" "claude"

#--------------------------------------------------------------------------
# Sesh Integration
#--------------------------------------------------------------------------
bind-key "T" run-shell "sesh connect \"$(
  sesh list --icons | fzf-tmux -p 80%,60% \
    --no-sort --ansi --border-label ' sesh ' --prompt '⚡  ' \
    --header '  ^a all ^t tmux ^g configs ^x zoxide ^d tmux kill ^f find' \
    --bind 'tab:down,btab:up' \
    --bind 'ctrl-a:change-prompt(⚡  )+reload(sesh list --icons)' \
    --bind 'ctrl-t:change-prompt(🪟  )+reload(sesh list -t --icons)' \
    --bind 'ctrl-g:change-prompt(⚙️  )+reload(sesh list -c --icons)' \
    --bind 'ctrl-x:change-prompt(📁  )+reload(sesh list -z --icons)' \
    --bind 'ctrl-f:change-prompt(🔎  )+reload(fd -H -d 2 -t d -E .Trash . ~)' \
    --bind 'ctrl-d:execute(tmux kill-session -t {2..})+change-prompt(⚡  )+reload(sesh list --icons)' \
    --preview-window 'right:0%' \
    --preview 'sesh preview {}'
)\""

# Find and jump to window
bind f display-popup -E "\
    tmux list-windows -F '#{window_index} #{window_name}' |\
    sed '/^$/d' |\
    fzf --reverse --header select-window |\
    cut -d ' ' -f 1 |\
    xargs tmux select-window -t"

# Find and jump to session
bind e display-popup -E "\
    tmux list-sessions -F '#{?session_attached,,#{session_name}}' |\
    sed '/^$/d' |\
    fzf --reverse --header select-session |\
    xargs tmux switch-client -t"

#--------------------------------------------------------------------------
# List Panes Integration
# --------------------------------------------------------------------------
# bind-key f run-shell -b "$HOME/.config/tmux/scripts/list-panes.sh"

#--------------------------------------------------------------------------
# Plugins
#--------------------------------------------------------------------------
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'joshmedeski/tmux-nerd-font-window-name'
set -g @plugin 'tmux-plugins/tmux-yank'

# Turn off auto-continuum restore (set to 'on' if you want sessions restored)
set -g @continuum-restore 'off'
set -g @resurrect-strategy-vim 'session'
set -g @resurrect-strategy-nvim 'session'
set -g @resurrect-capture-pane-contents 'on'

# Initialize Tmux Plugin Manager
run ~/.config/tmux/plugins/tpm/tpm
